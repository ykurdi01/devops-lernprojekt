# Braucht einen laufenden metrics-server im Cluster, um wirklich zu skalieren.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lernprojekt-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lernprojekt-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
