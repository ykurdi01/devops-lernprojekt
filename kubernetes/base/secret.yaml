# Nur ein Platzhalter fuer den lokalen Betrieb.
# Ein echtes Projekt wuerde hier keinen Wert einchecken, sondern zum Beispiel
# Sealed Secrets, den External Secrets Operator oder Vault verwenden.
apiVersion: v1
kind: Secret
metadata:
  name: lernprojekt-secret
type: Opaque
stringData:
  APP_SECRET_KEY: "bitte-lokal-ueberschreiben"
